[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/follow"
  to = "https://www.facebook.com/aroundarmstrong"
  status = 302

[[redirects]]
  from = "/card"
  to = "https://www.facebook.com/aroundarmstrong"
  status = 302

[[redirects]]
  from = "/board"
  to = "https://www.facebook.com/aroundarmstrong"
  status = 302

[[redirects]]
  from = "/chamber"
  to = "https://www.facebook.com/aroundarmstrong"
  status = 302
